  <circle cx="268" cy="206" r="54" fill="#3FC0F0" fill-opacity=".22" stroke="#00417B" stroke-width="12"/>
  <path d="M240 186 a34 34 0 0 1 24 -14" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity=".9"/>
