<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" role="img" aria-labelledby="t">
  <title id="t">Documentos apilados con una lupa</title>
  <!-- sombra -->
  <ellipse cx="200" cy="312" rx="150" ry="14" fill="#00417B" opacity=".10"/>
  <!-- documento de atrás -->
  <g transform="rotate(-8 230 160)">
    <rect x="170" y="40" width="170" height="230" rx="10" fill="#E8EDF5"/>
    <rect x="170" y="40" width="170" height="26" rx="10" fill="#3A93D0"/>
  </g>
  <!-- documento del medio -->
  <g transform="rotate(4 200 170)">
    <rect x="130" y="52" width="170" height="232" rx="10" fill="#FFFFFF" stroke="#C9D6E6" stroke-width="2"/>
    <rect x="130" y="52" width="170" height="26" rx="10" fill="#00417B"/>
    <rect x="150" y="98" width="110" height="9" rx="4.5" fill="#C9D6E6"/>
    <rect x="150" y="118" width="130" height="9" rx="4.5" fill="#C9D6E6"/>
    <rect x="150" y="138" width="90" height="9" rx="4.5" fill="#C9D6E6"/>
  </g>
  <!-- documento de adelante -->
  <rect x="80" y="70" width="176" height="236" rx="12" fill="#FFFFFF" stroke="#B9C9DC" stroke-width="2"/>
  <rect x="80" y="70" width="176" height="44" rx="12" fill="#132B41"/>
  <rect x="80" y="100" width="176" height="14" fill="#132B41"/>
  <rect x="100" y="86" width="12" height="12" fill="#3FC0F0"/><rect x="108" y="94" width="12" height="12" fill="#00417B"/>
  <rect x="130" y="88" width="90" height="8" rx="4" fill="#FFFFFF" opacity=".85"/>
  <rect x="100" y="134" width="136" height="8" rx="4" fill="#D5DFEA"/>
  <rect x="100" y="152" width="120" height="8" rx="4" fill="#D5DFEA"/>
  <rect x="100" y="170" width="132" height="8" rx="4" fill="#D5DFEA"/>
  <!-- gráfico de barras -->
  <rect x="100" y="230" width="18" height="44" rx="3" fill="#3FC0F0"/>
  <rect x="126" y="212" width="18" height="62" rx="3" fill="#3A93D0"/>
  <rect x="152" y="196" width="18" height="78" rx="3" fill="#00417B"/>
  <rect x="96" y="276" width="80" height="3" rx="1.5" fill="#B9C9DC"/>
  <rect x="190" y="200" width="46" height="8" rx="4" fill="#D5DFEA"/>
