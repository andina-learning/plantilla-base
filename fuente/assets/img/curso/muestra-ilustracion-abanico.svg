<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img"
     aria-label="Tres piezas de izquierda a derecha. A la izquierda, la ventana de una herramienta de IA: arriba, la pregunta que se le hizo; abajo, su primera respuesta, la alternativa más probable. De la ventana salen tres flechas que se abren en abanico hacia tres tarjetas, cada una con la pregunta que la produjo: «Dame otra opción», con otra alternativa; «Argumenta en contra», con un signo menos; «Dime qué te falta», con un hueco punteado. Las tres flechas se juntan y llegan a la derecha, donde está la persona que decide, con lo que la herramienta no conoce a su lado: el contexto interno, lo informal y las consecuencias. Debajo de la persona, la decisión marcada con un visto, la única pieza en amarillo.">
  <!-- Ilustración de marca · Universidad Andina Virtual · demo Unidad 4, tema 2 (apertura)
       Concepto (DI): «La IA generativa no "sabe" cuál es la mejor alternativa; genera la
       alternativa más probable dado cómo se le preguntó.» El error: «tratar la primera
       respuesta de la IA como si fuera la única posible». Las tres preguntas del acordeón
       («Dame otra opción», «Argumenta en contra», «Dime qué te falta») sirven para «ampliar el
       abanico de alternativas»; la herramienta «no conoce el contexto interno», «lo informal»
       ni responde por «las consecuencias»: «no puede saber cuál de ellas es viable en el
       contexto real de quien decide».
       Único amarillo: el contorno de la decisión, que queda del lado de la persona. -->
  <defs>
    <linearGradient id="ilu-abanico-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#E6F3FA"/>
      <stop offset="55%"  stop-color="#E8EDF5"/>
      <stop offset="100%" stop-color="#F5F8FB"/>
    </linearGradient>
    <filter id="ilu-abanico-sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#132B41" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="440" rx="18" fill="url(#ilu-abanico-fondo)"/>

  <!-- Las piezas: la ventana de la herramienta, las tres respuestas nuevas y el lado de quien decide -->
  <g filter="url(#ilu-abanico-sombra)" fill="#FFFFFF">
    <rect x="40"  y="62" width="280" height="276" rx="16"/>
    <rect x="512" y="62" width="236" height="84" rx="14" transform="rotate(-3 630 104)"/>
    <rect x="528" y="158" width="236" height="84" rx="14"/>
    <rect x="512" y="254" width="236" height="84" rx="14" transform="rotate(3 630 296)"/>
    <rect x="840" y="62" width="320" height="276" rx="16"/>
  </g>

  <!-- ══ 1 · La herramienta: la pregunta y su primera respuesta, la más probable ══ -->
  <g fill="#132B41" opacity=".2">
    <circle cx="64" cy="86" r="4.5"/>
    <circle cx="80" cy="86" r="4.5"/>
    <circle cx="96" cy="86" r="4.5"/>
  </g>
  <rect x="56" y="104" width="248" height="2.5" rx="1.25" fill="#132B41" opacity=".12"/>
  <!-- cómo se le preguntó -->
  <rect x="140" y="120" width="160" height="50" rx="14" fill="#00417B" opacity=".12"/>
  <g fill="#132B41" opacity=".3">
    <rect x="158" y="134" width="124" height="8" rx="4"/>
    <rect x="158" y="150" width="84" height="8" rx="4"/>
  </g>
  <!-- la primera respuesta -->
  <rect x="60" y="186" width="200" height="132" rx="12" fill="#DCE8F3"/>
  <circle cx="82" cy="210" r="9" fill="#00417B" opacity=".85"/>
  <rect x="100" y="205" width="120" height="10" rx="5" fill="#132B41" opacity=".5"/>
  <g fill="#132B41" opacity=".28">
    <rect x="76" y="234" width="166" height="8" rx="4"/>
    <rect x="76" y="252" width="150" height="8" rx="4"/>
    <rect x="76" y="270" width="160" height="8" rx="4"/>
    <rect x="76" y="288" width="110" height="8" rx="4"/>
  </g>

  <!-- ══ 2 · Interrogarla: cada pregunta abre una tarjeta más del abanico ══ -->
  <g fill="none" stroke="#00417B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".75">
    <path d="M330 200 C 420 200, 420 108, 502 108"/>
    <path d="M496 100 l8 8 -8 8"/>
    <line x1="330" y1="200" x2="518" y2="200"/>
    <path d="M512 192 l8 8 -8 8"/>
    <path d="M330 200 C 420 200, 420 290, 502 290"/>
    <path d="M496 282 l8 8 -8 8"/>
  </g>

  <!-- Dame otra opción: otra alternativa -->
  <g transform="rotate(-3 630 104)">
    <rect x="528" y="76" width="146" height="26" rx="13" fill="#00417B" opacity=".12"/>
    <text x="601" y="94" text-anchor="middle" font-family="Manrope, system-ui, sans-serif"
          font-size="14" font-weight="600" fill="#132B41">Dame otra opción</text>
    <g fill="#132B41" opacity=".28">
      <rect x="528" y="114" width="150" height="8" rx="4"/>
      <rect x="528" y="128" width="110" height="8" rx="4"/>
    </g>
    <circle cx="716" cy="118" r="9" fill="#00417B" opacity=".85"/>
  </g>

  <!-- Argumenta en contra: contra su propia primera respuesta -->
  <rect x="544" y="172" width="168" height="26" rx="13" fill="#00417B" opacity=".12"/>
  <text x="628" y="190" text-anchor="middle" font-family="Manrope, system-ui, sans-serif"
        font-size="14" font-weight="600" fill="#132B41">Argumenta en contra</text>
  <g fill="#132B41" opacity=".28">
    <rect x="544" y="210" width="150" height="8" rx="4"/>
    <rect x="544" y="224" width="110" height="8" rx="4"/>
  </g>
  <circle cx="732" cy="216" r="13" fill="none" stroke="#00417B" stroke-width="3"/>
  <line x1="725" y1="216" x2="739" y2="216" stroke="#00417B" stroke-width="3" stroke-linecap="round"/>

  <!-- Dime qué te falta: la información que le faltó -->
  <g transform="rotate(3 630 296)">
    <rect x="528" y="268" width="150" height="26" rx="13" fill="#00417B" opacity=".12"/>
    <text x="603" y="286" text-anchor="middle" font-family="Manrope, system-ui, sans-serif"
          font-size="14" font-weight="600" fill="#132B41">Dime qué te falta</text>
    <g fill="#132B41" opacity=".28">
      <rect x="528" y="306" width="150" height="8" rx="4"/>
      <rect x="528" y="320" width="110" height="8" rx="4"/>
    </g>
    <rect x="694" y="300" width="44" height="30" rx="6" fill="none" stroke="#132B41" stroke-width="2.5"
          stroke-dasharray="5 5" opacity=".45"/>
  </g>

  <!-- Las alternativas llegan a quien decide -->
  <g fill="none" stroke="#00417B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".55">
    <path d="M756 98 C 800 98, 796 200, 830 200"/>
    <line x1="772" y1="200" x2="830" y2="200"/>
    <path d="M756 302 C 800 302, 796 200, 830 200"/>
    <path d="M824 192 l8 8 -8 8"/>
  </g>

  <!-- ══ 3 · Quien decide, con lo que la herramienta no conoce ══ -->
  <circle cx="902" cy="118" r="14" fill="none" stroke="#00417B" stroke-width="4"/>
  <path d="M882 160 a20 15 0 0 1 40 0" fill="none" stroke="#00417B" stroke-width="4" stroke-linecap="round"/>

  <!-- el contexto interno -->
  <rect x="974" y="82" width="24" height="30" rx="3" fill="none" stroke="#132B41" stroke-width="2.5" opacity=".85"/>
  <g fill="#132B41" opacity=".5">
    <rect x="979" y="88" width="5" height="5" rx="1"/>
    <rect x="988" y="88" width="5" height="5" rx="1"/>
    <rect x="979" y="97" width="5" height="5" rx="1"/>
    <rect x="988" y="97" width="5" height="5" rx="1"/>
    <rect x="983" y="105" width="6" height="7" rx="1"/>
  </g>
  <!-- lo informal: acuerdos, cultura de equipo, relaciones -->
  <g fill="none" stroke="#132B41" stroke-width="2.5" stroke-linecap="round" opacity=".85">
    <circle cx="980" cy="135" r="5"/>
    <circle cx="993" cy="135" r="5"/>
    <path d="M972 152 a8 7 0 0 1 16 0"/>
    <path d="M985 152 a8 7 0 0 1 16 0"/>
  </g>
  <!-- las consecuencias: la balanza -->
  <g fill="none" stroke="#132B41" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".85">
    <line x1="986" y1="172" x2="986" y2="198"/>
    <line x1="978" y1="198" x2="994" y2="198"/>
    <line x1="972" y1="176" x2="1000" y2="176"/>
    <path d="M972 176 L966 187 M972 176 L978 187 M1000 176 L994 187 M1000 176 L1006 187"/>
    <path d="M965 187 q7 6 14 0"/>
    <path d="M993 187 q7 6 14 0"/>
  </g>
  <g font-family="Manrope, system-ui, sans-serif" font-size="13" font-weight="600" fill="#00417B">
    <text x="1014" y="102">contexto interno</text>
    <text x="1014" y="148">lo informal</text>
    <text x="1014" y="190">las consecuencias</text>
  </g>

  <!-- la persona elige -->
  <g fill="none" stroke="#00417B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".55">
    <line x1="902" y1="176" x2="902" y2="222"/>
    <path d="M894 216 l8 8 8 -8"/>
  </g>
  <!-- la decisión -->
  <rect x="864" y="236" width="272" height="78" rx="12" fill="#E8EDF5"/>
  <circle cx="900" cy="275" r="15" fill="#00417B"/>
  <path d="M893 275 l5 5 9 -10" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#132B41" opacity=".3">
    <rect x="928" y="262" width="168" height="9" rx="4.5"/>
    <rect x="928" y="280" width="124" height="9" rx="4.5"/>
  </g>
  <!-- ÚNICO AMARILLO: decidir cuál alternativa es viable sigue siendo de la persona -->
  <rect x="864" y="236" width="272" height="78" rx="12" fill="none" stroke="#F0B443" stroke-width="4"/>

  <!-- Rótulos, literales del DI -->
  <g font-family="Manrope, system-ui, sans-serif" font-size="17" text-anchor="middle">
    <g font-weight="600" fill="#132B41">
      <text x="180"  y="374">primera respuesta</text>
      <text x="640"  y="374">las tres preguntas</text>
      <text x="1000" y="374">quien decide</text>
    </g>
    <g font-weight="400" fill="#00417B">
      <text x="180"  y="400">la alternativa más probable</text>
      <text x="640"  y="400">ampliar el abanico</text>
      <text x="1000" y="400">cuál alternativa es viable</text>
    </g>
  </g>
</svg>
