<style>
  /* =========================================================
     PORTADA · Universidad Andina Virtual
     Sigue las portadas de video de la línea gráfica (apertura,
     cierre, pódcast): fondo abismo→azul con la foto fundida a la
     derecha, destellos diagonales translúcidos, la greca apenas
     visible y el contraste Light / ExtraBold en el titular.
     El CSS de portada viaja por curso (igual que en Scala).
     ========================================================= */
  .ua-portada{
    position:relative; overflow:hidden; isolation:isolate;
    min-height:100vh; min-height:100dvh;
    display:flex; align-items:center;
    background: var(--grad-andina);
    color:#fff;
  }
  /* la greca andina, como en los banners del aula */
  .ua-portada::before{
    content:''; position:absolute; inset:0; z-index:0; pointer-events:none;
    background:#fff;
    -webkit-mask: var(--ua-greca) 0 0 / 163px 209px repeat;
            mask: var(--ua-greca) 0 0 / 163px 209px repeat;
    opacity:.025;
  }
  /* La ilustración del catálogo: un cubo de piezas casi armado y la pieza que falta, en amarillo,
     bajando a su lugar. Va en primer plano a la derecha. Se genera con insumos/portada-cubo.py. */
  .ua-portada__figura{
    position:absolute; z-index:2; top:50%; right:clamp(16px, 5vw, 96px);
    width:min(42vw, 600px, 78vh); transform:translateY(-50%);
  }
  .ua-portada__figura img{ display:block; width:100%; height:auto; }
  /* destellos diagonales: los planos de luz azul de las miniaturas de video */
  .ua-portada__luz{
    position:absolute; inset:-6%; z-index:1; pointer-events:none;
    background:
      linear-gradient(155deg, transparent 52%, rgba(63,192,240,.16) 52.2%, rgba(63,192,240,.04) 66%, transparent 66.2%),
      linear-gradient(28deg,  transparent 58%, rgba(58,147,208,.20) 58.2%, rgba(58,147,208,.05) 74%, transparent 74.2%),
      linear-gradient(200deg, transparent 70%, rgba(0,65,123,.35) 70.2%, transparent 88%);
  }
  /* el escalón de cuadros asienta la esquina inferior derecha; el sol y la estrella, arriba */
  .ua-portada__pixeles{
    position:absolute; z-index:2; bottom:0; right:0; transform:scaleX(-1);
    width:clamp(84px, 9vw, 132px); aspect-ratio:1;
    background:var(--ua-pixeles-claro) center / contain no-repeat;
  }
  .ua-portada__sol{
    position:absolute; z-index:2; top:clamp(26px, 6vh, 64px); right:clamp(260px, 30vw, 460px);
    width:clamp(44px, 4.6vw, 66px); aspect-ratio:1;
    background:var(--ua-sol) center / contain no-repeat;
  }
  .ua-portada__estrella{
    position:absolute; z-index:2; top:clamp(70px, 14vh, 150px); right:clamp(24px, 4vw, 64px);
    width:clamp(40px, 4vw, 58px); aspect-ratio:1;
    background:var(--ua-estrella) center / contain no-repeat;
  }

  .ua-portada__inner{
    position:relative; z-index:3;
    width:100%; max-width:1240px; margin:0 auto;
    padding:clamp(20px, 4.5vh, 88px) clamp(32px, 6vw, 88px);
  }
  .ua-portada__texto{ max-width:620px; }
  .ua-portada__logo img{ height:min(58px, 7vh); width:auto; display:block; margin-bottom:clamp(14px, 3.5vh, 56px); }
  .ua-portada__eyebrow{
    display:inline-flex; align-items:center; gap:12px;
    font-family:var(--font-display); font-weight:800; font-size:.8rem;
    letter-spacing:.26em; text-transform:uppercase;
    color:#fff; margin-bottom:clamp(10px, 2.4vh, 20px);
  }
  .ua-portada__eyebrow::before{
    content:''; width:26px; height:10px;
    background:var(--ua-eyebrow) left center / contain no-repeat;
  }
  .ua-portada__title{
    margin:0 0 clamp(10px, 2.4vh, 20px); color:#fff;
    font-family:var(--font-display); font-weight:800;
    font-size:min(clamp(2.5rem, 5.2vw, 4rem), 8.6vh); line-height:1.06; letter-spacing:-.025em;
  }
  /* Dos pesos, no tres (revisión de Scala, ajuste 6): todo el título en blanco 800 y el remate
     en celeste 800. El remate es lo que el instruccional marca en negrilla en la portada del Word. */
  .ua-portada__title .ua-remate{ color:var(--c-cielo); }
  /* Título largo: un escalón menos para que título, subtítulo, frase y botón
     sigan cabiendo en la primera pantalla. Se acorta el tamaño, nunca el título. */
  .ua-portada__title--largo{ font-size:min(clamp(2.1rem, 4.1vw, 3.15rem), 7.4vh); }
  /* la línea fina bajo el titular, como en las miniaturas de video */
  .ua-portada__sub{
    margin:0 0 clamp(12px, 3vh, 28px); padding-top:clamp(8px, 1.8vh, 16px);
    border-top:1px solid rgba(255,255,255,.28);
    max-width:440px;
    color:rgba(255,255,255,.86);
    font-size:clamp(1rem, 1.5vw, 1.15rem); font-weight:300; letter-spacing:.02em;
  }
  .ua-portada__quote{
    color:#fff; font-weight:300;
    font-size:min(clamp(1.02rem, 1.6vw, 1.22rem), 2.7vh); line-height:1.55;
    max-width:500px; margin:0 0 clamp(16px, 4vh, 38px);
    padding-left:20px; border-left:3px solid var(--c-cielo);
  }
  /* CTA en píldora blanca (estado «desplazar» de la p. 9 de la línea gráfica) */
  .ua-portada__acciones{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .ua-portada__cta{
    display:inline-flex; align-items:center; gap:10px;
    background:#fff; color:var(--c-acento); text-decoration:none;
    font-family:var(--font-display); font-weight:800; font-size:1rem;
    padding:clamp(12px, 1.8vh, 16px) 30px; border-radius:999px;
    box-shadow:0 14px 34px rgba(5,20,36,.40);
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease, color .18s ease;
  }
  /* el color se fija también en hover: el motor tiñe todo enlace en hover */
  .ua-portada__cta:hover,
  .ua-portada__cta:focus-visible{ background:var(--c-cielo); color:var(--c-deep); transform:translateY(-2px); }
  .ua-portada__descarga{
    display:inline-grid; place-items:center;
    width:52px; height:52px; border-radius:50%;
    color:#fff; text-decoration:none;
    border:1.5px solid rgba(255,255,255,.5);
    transition:border-color .2s ease;
  }
  .ua-portada__descarga svg{ width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; overflow:visible; }
  .ua-portada__descarga .ua-flecha{ transition:transform .28s cubic-bezier(.34,1.4,.64,1); }
  .ua-portada__descarga:hover, .ua-portada__descarga:focus-visible{ border-color:#fff; color:#fff; }
  .ua-portada__descarga:hover .ua-flecha, .ua-portada__descarga:focus-visible .ua-flecha{ transform:translateY(3.5px); }

  @media (prefers-reduced-motion: reduce){
    .ua-portada__descarga .ua-flecha{ transition:none; }
    .ua-portada__cta{ transition:none; }
  }
  /* Móvil: la foto no se oculta; pasa arriba, a franja, y el texto debajo */
  @media (max-width: 900px){
    .ua-portada{ flex-direction:column; align-items:stretch; }
    .ua-portada__figura{
      position:relative; top:auto; right:auto; transform:none;
      width:min(74vw, 340px); margin:28px auto 0;
    }
    .ua-portada__pixeles{ width:70px; }
    .ua-portada__sol{ right:24px; top:20px; }
    .ua-portada__estrella{ display:none; }
    .ua-portada__inner{ padding-top:8px; }
    .ua-portada__logo img{ height:44px; margin-bottom:24px; }
  }
</style>

<section class="ua-portada">
  <div class="ua-portada__figura">
    <img src="assets/img/curso/portada-cubo.svg" alt="Un cubo de piezas armado casi por completo; la pieza de la esquina, en amarillo, baja a encajar en su lugar." />
  </div>
  <div class="ua-portada__luz" aria-hidden="true"></div>
  <span class="ua-portada__pixeles" aria-hidden="true"></span>
  <span class="ua-portada__sol" aria-hidden="true"></span>
  <span class="ua-portada__estrella" aria-hidden="true"></span>

  <div class="ua-portada__inner">
    <div class="ua-portada__texto">
      <div class="ua-portada__logo">
        <img src="assets/img/logos/andina-logo-blanco.png" alt="Universidad Andina Virtual · Escuela de Posgrado" />
      </div>

      <div class="ua-portada__eyebrow">Andina Virtual · Plantilla base</div>

      <!-- Plantilla: el título literal del Word. Lo que el instruccional marque en negrilla en la
           portada del DI va en <span class="ua-remate"> (celeste); el resto, blanco. Sin negrilla, todo blanco. -->
      <h1 class="ua-portada__title">
        Catálogo <span class="ua-remate">de componentes</span>
      </h1>

      <p class="ua-portada__sub">Plantilla base del recurso educativo</p>

      <!-- Frase destacada de la portada, literal del Word (una o dos líneas) -->
      <p class="ua-portada__quote">
        Recorre la estructura del curso, sus estilos y los componentes que puedes marcar en la plantilla de diseño instruccional.
      </p>

      <div class="ua-portada__acciones">
        <a class="ua-portada__cta" href="temario.html">
          Ver el contenido
          <iconify-icon icon="mdi:arrow-right"></iconify-icon>
        </a>
        <a class="ua-portada__descarga" href="{{PDF}}" download title="Descargar el cuaderno de aprendizaje (PDF)" aria-label="Descargar el cuaderno de aprendizaje en PDF" data-ova-pdf-btn><svg viewBox="0 0 24 24" aria-hidden="true"><g class="ua-flecha"><path d="M12 2.5V11.5"/><path d="M8.5 8L12 11.5L15.5 8"/></g><path d="M5 16v2.5a1.5 1.5 0 0 0 1.5 1.5h11a1.5 1.5 0 0 0 1.5-1.5V16"/></svg></a>
      </div>
    </div>
  </div>
</section>
